
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inscripción a cursos</title>

<style>

body {
    font-family: Arial, sans-serif;
    background: #eaf0ff;
    margin: 0;
    padding: 20px;
}

.contenedor {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 3px 12px #aaa;
}

h1, h2 {
    text-align: center;
    color: #6545c5;
}

input, select {
    width: 95%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #bbb;
    border-radius: 7px;
}

button {
    width: 100%;
    padding: 12px;
    background: #704bd1;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

button:hover {
    background: #5030a5;
}

li {
    margin: 12px 0;
}

</style>
</head>

<body>

<div class="contenedor">

<h1>Inscripción a cursos</h1>

<form id="formulario">

<input type="text" id="nombre"
placeholder="Nombre completo" required>

<input type="text" id="matricula"
placeholder="Matrícula" required>

<input type="email" id="correo"
placeholder="Correo electrónico" required>

<select id="curso" required>
<option value="">Selecciona un curso</option>
<option>Programación</option>
<option>Diseño Web</option>
<option>Base de Datos</option>
<option>Inglés</option>
<option>Informática</option>
</select>

<select id="modalidad" required>
<option value="">Selecciona modalidad</option>
<option>Presencial</option>
<option>En línea</option>
<option>Mixta</option>
</select>

<button type="submit">
Inscribirme al curso
</button>

</form>

<h2>Inscripciones registradas</h2>

<ul id="lista">
<li>No hay inscripciones registradas.</li>
</ul>

</div>

<script>

let inscripciones = JSON.parse(
    localStorage.getItem("inscripciones")
) || [];

function mostrarInscripciones() {

    let lista = document.getElementById("lista");

    lista.innerHTML = "";

    if (inscripciones.length === 0) {
        lista.innerHTML = "<li>No hay inscripciones registradas.</li>";
        return;
    }

    inscripciones.forEach(function(i) {

        let elemento = document.createElement("li");

        elemento.innerHTML = `
            <strong>${i.nombre}</strong><br>
            Matrícula: ${i.matricula}<br>
            Correo: ${i.correo}<br>
            Curso: ${i.curso}<br>
            Modalidad: ${i.modalidad}
        `;

        lista.appendChild(elemento);

    });

}

document.getElementById("formulario").addEventListener("submit", function(e) {

    e.preventDefault();

    let nuevaInscripcion = {
        nombre: document.getElementById("nombre").value,
        matricula: document.getElementById("matricula").value,
        correo: document.getElementById("correo").value,
        curso: document.getElementById("curso").value,
        modalidad: document.getElementById("modalidad").value
    };

    inscripciones.push(nuevaInscripcion);

    localStorage.setItem(
        "inscripciones",
        JSON.stringify(inscripciones)
    );

    alert("¡Inscripción realizada correctamente!");

    this.reset();

    mostrarInscripciones();

});

mostrarInscripciones();

</script>

</body>
</html>
